<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fb14d" />
      <stop offset="100%" stop-color="#1b8532" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d71b7" />
      <stop offset="100%" stop-color="#254d85" />
    </linearGradient>
  </defs>

  <!-- Emblem: Stylized Recycling Loop / N Shape -->
  <g transform="translate(10, 10)">
    <!-- First Loop Segment (Green) -->
    <path d="M 50 10 C 25 10, 10 25, 10 50 C 10 75, 25 90, 50 90 C 65 90, 75 80, 80 70 L 65 60 C 62 68, 57 72, 50 72 C 38 72, 28 62, 28 50 C 28 38, 38 28, 50 28 C 62 28, 70 35, 71 45 L 89 45 C 88 25, 72 10, 50 10 Z" fill="url(#greenGrad)" />
    <!-- Second Loop Segment (Blue) -->
    <path d="M 50 10 C 65 10, 78 18, 84 30 L 69 40 C 66 33, 59 28, 50 28 C 45 28, 40 30, 36 34 L 23 21 C 30 14, 40 10, 50 10 Z" fill="url(#blueGrad)" opacity="0.9" />
    <!-- Center Accent Leaf (Orange Accent) -->
    <path d="M 50 50 C 50 35, 65 25, 75 25 C 75 40, 60 50, 50 50 Z" fill="#f68a35" />
  </g>

  <!-- Typography -->
  <!-- NEVRA (Bold, Clean Sans) -->
  <text x="120" y="65" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="44" font-weight="800" fill="#1a1e20" letter-spacing="1.5">NEVRA</text>
  <!-- PLASTİK (Light, Tracked) -->
  <text x="120" y="95" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#6d7172" letter-spacing="9">PLASTİK</text>
  <!-- Slogan / Subtitle (Tiny, elegant) -->
  <text x="315" y="62" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#2fb14d" letter-spacing="2">RECYCLED POLYMERS</text>
</svg>
